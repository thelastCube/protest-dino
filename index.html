<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Road to Jantar Mantar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e9e2cf; }
  body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: pointer; }
  #fs {
    position: fixed; right: 12px; bottom: 12px; z-index: 2;
    font: 16px monospace; padding: 6px 9px; border: 2px solid #535353; background: #f7f1e1;
    color: #535353; cursor: pointer; opacity: .75;
  }
  #fs:hover { opacity: 1; }
  #credit {
    position: fixed; left: 10px; bottom: 8px; z-index: 2; font: 10px sans-serif; color: rgba(60,60,60,.6);
  }
  #credit a { color: inherit; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="fs" title="Toggle fullscreen (F)">⛶</button>
<div id="credit">Barricade art: KUCH BHI?</div>

<script>
// =====================================================================
//  ROAD TO JANTAR MANTAR — a Chrome-dino-style satire.
//  World coordinates: u = along the road (direction of travel),
//  v = across the road (+ is the far side), z = height.
//  The camera is a gentle isometric projection that matches the
//  angle of the barricade artwork.
// =====================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const FONT = '"Press Start 2P", "Courier New", monospace';

// iso axes (screen px per world unit)
const UX = 0.894, UY = 0.447;     // along the road: down-right
const VX = 0.874, VY = -0.486;    // across the road: up-right (matches barricade face)

// ---- sprites ----
const barricadeImg = new Image(); barricadeImg.src = 'assets/barricade.png';
const jmImg = new Image(); jmImg.src = 'assets/jantar-mantar.png';
const JM_H = 150;   // on-screen height of the Jantar Mantar sprite

// barricade sprite geometry (measured from assets/barricade.png, 228x320)
const BAR_K = 0.375;
const BAR_W = 228 * BAR_K, BAR_H = 320 * BAR_K;
const BAR_FOOT_X = 50 * BAR_K, BAR_FOOT_Y = 319 * BAR_K;   // front-left foot
const BAR_FACE = 195 * BAR_K;      // length of the face along v
const BAR_DEPTH = 16, BAR_TOP = 66, ROW_GAP = 38;

const R = BAR_FACE * 1.5;          // road half-width: three barricades across
const VFAR = R + 330;              // far edge of the world (skyline)
const M_PER_U = 1 / 25;            // metres per world unit

const GRAVITY = 0.8, JUMP_V = 15.5;
const PX = 3.5;                    // dino pixel size

// ---- dino pixel art (Chrome T-rex, with a Gandhi topi) ----
const DINO_TOP = [
  '...........########.',
  '..........##.#######',
  '..........##########',
  '..........##########',
  '..........##########',
  '..........#####.....',
  '..........########..',
  '#........#####......',
  '#.......#######.....',
  '##.....##########...',
  '###...#########.#...',
  '##############......',
  '.#############......',
  '..###########.......',
  '...#########........',
  '....#######.........',
];
const LEGS_STAND = ['....###.##', '....##...#', '....#....#', '....##...##'];
const LEGS_A     = ['....###.##', '....##..##', '....#.....', '....##....'];
const LEGS_B     = ['....###.##', '.....##..#', '.........#', '.........##'];
const DUCK_TOP = [
  '#..................########',
  '##...........########.#####',
  '###......##################',
  '##################.######..',
  '.#################.#.......',
  '..###############..........',
  '...############............',
];
const DUCK_A = ['....###....##', '....##......#', '....#.......##'];
const DUCK_B = ['....###...##.', '.....##..##..', '......#......'];

const MESSAGES_OVER = [
  'Detained. Taken to Parliament Street police station.',
  'Section 144 imposed. Please disperse.',
  'Permission to protest: under consideration since 2017.',
  'Please apply 10 days in advance. In triplicate.',
  'Protest site shifted to Ramlila Maidan. Or Burari. TBD.',
  'Bus will drop you at an undisclosed location.',
  'Your placard has been seized for "verification".',
  'Dinosaurs are not permitted to assemble in groups of one.',
];
const MESSAGES_DRONE = [
  'Spotted by drone. Your face has been "matched".',
  'Drone footage forwarded to the concerned department.',
];
const TOASTS = [
  'Central Secretariat metro gates closed',
  'Route diverted via Ring Road',
  'Patel Chowk metro gates closed',
  'Section 144 imposed in New Delhi district',
  'Mobile internet suspended in the area',
  'Traffic advisory: avoid Sansad Marg',
  'Additional barricades deployed',
  'Drone surveillance active',
  'Rajiv Chowk exit 4 closed. And 5. And 6.',
];

// ---- layout ----
let VW, VH, SCALE, O = { x: 0, y: 0 };
function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  SCALE = Math.min(innerHeight / 720, innerWidth / 900);
  VW = innerWidth / SCALE; VH = innerHeight / SCALE;
  ctx.setTransform(dpr * SCALE, 0, 0, dpr * SCALE, 0, 0);
  ctx.imageSmoothingEnabled = true;
  O.x = Math.max(150, VW * 0.2);
  O.y = Math.min(VH * 0.42, 330);
}
addEventListener('resize', resize);
resize();

let cam = 0;   // u of the player
function P(u, v, z = 0) {
  const du = u - cam;
  return [O.x + du * UX + v * VX, O.y + du * UY + v * VY - z];
}
// how far ahead (in u) something at (v, height h) must be to be off-screen
function aheadFor(v, h) {
  const below = (VH - O.y - v * VY + h + 20) / UY;
  const right = (VW - O.x - v * VX + 120) / UX;
  return Math.min(below, right);
}

// ---- game state ----
let state;
let hi = parseFloat(localStorage.getItem('jm_hi') || '0');
const keys = {};
let typed = '';

function reset(autostart) {
  cam = 0;
  state = {
    mode: autostart ? 'running' : 'ready',
    frame: 0,
    speed: 7,
    player: { z: 0, vz: 0, onGround: true, ducking: false },
    obstacles: [],
    scenery: [],
    nextObstacle: 900,
    nextScenery: -1500,
    nextLamp: -1500,
    buildingRows: [{ v: VFAR + 30, next: -1500 }, { v: VFAR + 230, next: -1450 }],
    signIdx: Math.floor(Math.random() * 20),
    nextEvent: 700 + Math.random() * 600,
    jm: { u: 620, v: R + 130, gone: false },
    skyDrone: null, nextSkyDrone: 400,
    leaflets: [],
    toast: null, toastQueue: [],
    nextToastAt: 220 + Math.random() * 150,
    nextKm: 1000,
    bubble: null,
    shoutUntil: 0,
    blinkUntil: 0,
    overMsg: '', fir: 0, overFrame: 0, flash: 0,
  };
  state.scenery.push({ type: 'sign', u: 300, v: R + 40, text: 'JANTAR MANTAR', sub: '2 km →', color: '#1d6b3a' });
  fillScenery();
  if (autostart) onStart();
}

function onStart() {
  if (Math.random() < 0.06) {
    toast('PERMISSION GRANTED!', 90, '#1d6b3a');
    toast('...for 2 people, 2-3 pm, no placards. Revoked.', 200);
  } else {
    toast('Jantar Mantar has been shifted. Please follow diversion.', 200);
  }
}

function toast(text, dur = 170, color) {
  state.toastQueue.push({ text, dur, color });
}

function metres() { return cam * M_PER_U; }

// ---- input ----
function jump() {
  if (state.mode === 'ready') { state.mode = 'running'; onStart(); }
  else if (state.mode === 'over') {
    if (state.frame - state.overFrame > 35) reset(true);
    return;
  }
  const p = state.player;
  if (p.onGround) { p.vz = JUMP_V; p.onGround = false; }
}
function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
  else document.exitFullscreen?.();
}
document.getElementById('fs').addEventListener('click', e => { e.stopPropagation(); toggleFullscreen(); });

addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  if ((e.code === 'Space' || e.code === 'ArrowUp') && !keys[e.code]) jump();
  if (e.code === 'KeyF' && !e.repeat) toggleFullscreen();
  keys[e.code] = true;
  if (e.key.length === 1 && /[a-z]/i.test(e.key)) {
    typed = (typed + e.key.toLowerCase()).slice(-20);
    if (typed.endsWith('inquilab')) {
      state.shoutUntil = state.frame + 180;
      say('INQUILAB ZINDABAD!', 180);
    } else if (typed.endsWith('permission')) {
      toast('Your application has been forwarded to the concerned department.', 220);
    } else if (typed.endsWith('chai')) {
      say('Ek cutting, please', 120);
    } else if (typed.endsWith('dalli')) {
      toast('It is spelled DELHI. Says so right on the... oh.', 200);
    }
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });

let touchDuck = false;
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (e.clientY > innerHeight * 0.72 && state.mode === 'running') { touchDuck = true; }
  else jump();
});
addEventListener('pointerup', () => { touchDuck = false; });
addEventListener('pointercancel', () => { touchDuck = false; });

function say(text, dur) { state.bubble = { text, until: state.frame + dur }; }

// ---- spawning ----
function fillScenery() {
  const s = state;
  while (s.nextScenery < cam + aheadFor(VFAR, 220)) {
    const u = s.nextScenery;
    const roll = Math.random();
    if (roll < 0.38) s.scenery.push({ type: 'tree', u, v: R + 70 + Math.random() * (VFAR - R - 110), size: 0.8 + Math.random() * 0.5, hue: Math.random() });
    else if (roll < 0.55) s.scenery.push({ type: 'palm', u, v: R + 60 + Math.random() * (VFAR - R - 100), size: 0.85 + Math.random() * 0.35 });
    else if (roll < 0.85) s.scenery.push({ type: 'tree', u, v: -R - 170 - Math.random() * 260, size: 0.8 + Math.random() * 0.5, hue: Math.random() });
    else s.scenery.push({ type: 'bush', u, v: Math.random() < 0.5 ? R + 52 : -R - 150 - Math.random() * 200 });
    s.nextScenery += 70 + Math.random() * 130;
  }
  while (s.nextLamp < cam + aheadFor(R + 30, 130)) {
    s.scenery.push({ type: 'lamp', u: s.nextLamp, v: R + 30 });
    s.nextLamp += 280;
  }
  for (const row of s.buildingRows) {
    while (row.next < cam + aheadFor(row.v + 120, 280)) {
      const b = { type: 'building', u: row.next, v: row.v + Math.random() * 30,
        lu: 90 + Math.random() * 130, d: 70 + Math.random() * 60, h: 60 + Math.random() * 170,
        tone: Math.floor(Math.random() * 3) };
      if (Math.random() < 0.45) {
        b.sign = BUILDING_SIGNS[s.signIdx++ % BUILDING_SIGNS.length];
        ctx.font = `8px ${FONT}`;
        const tw = Math.max(ctx.measureText(b.sign.text).width, b.sign.sub ? ctx.measureText(b.sign.sub).width * 0.75 : 0);
        b.lu = Math.max(b.lu, tw + 34);
        b.h = Math.max(b.h, 100);
      }
      s.scenery.push(b);
      row.next += b.lu + 30 + Math.random() * 90;
    }
  }
}

function spawnObstacle() {
  const s = state;
  const m = metres();
  const u = cam + aheadFor(R, 140);
  if (m > 350 && Math.random() < 0.25) {
    const low = Math.random() < 0.45;
    s.obstacles.push({ type: 'drone', u, z: low ? 10 : 44 });
    return;
  }
  const maxRows = m < 250 ? 1 : m < 800 ? 2 : 3;
  s.obstacles.push({ type: 'bar', u, n: 1 + Math.floor(Math.random() * maxRows) });
}

function spawnEvent() {
  const s = state;
  const roll = Math.random();
  if (roll < 0.35) s.scenery.push({ type: 'cow', u: cam + aheadFor(-R * 0.6, 70), v: -R * 0.75, walk: 0.12 });
  else if (roll < 0.7) s.scenery.push({ type: 'auto', u: cam + aheadFor(-R - 85, 80) + 40, v: -R - 85, drive: -3.5 });
  else s.scenery.push({ type: 'chai', u: cam + aheadFor(R + 75, 90), v: R + 75 });
}

// ---- collision ----
function playerBox() {
  const p = state.player;
  return p.ducking && p.onGround
    ? { u0: cam - 22, u1: cam + 40, z0: p.z, z1: p.z + 32 }
    : { u0: cam - 18, u1: cam + 26, z0: p.z, z1: p.z + 62 };
}
function obstacleBox(o) {
  if (o.type === 'bar') return { u0: o.u - BAR_DEPTH, u1: o.u + (o.n - 1) * ROW_GAP, z0: 0, z1: BAR_TOP };
  return { u0: o.u - 24, u1: o.u + 24, z0: o.z, z1: o.z + 18 };
}
const overlap = (a, b) => a.u0 < b.u1 && a.u1 > b.u0 && a.z0 < b.z1 && a.z1 > b.z0;

// ---- update ----
function update(dt) {
  const s = state;
  s.frame++;

  // toasts
  if ((!s.toast || s.frame > s.toast.until) && s.toastQueue.length) {
    const t = s.toastQueue.shift();
    s.toast = { ...t, until: s.frame + t.dur };
  }

  if (s.mode !== 'running') return;
  const p = s.player;

  s.speed = Math.min(16, 7 + cam / 4500);
  const v = s.speed * dt;
  cam += v;

  // Jantar Mantar: shown at the start, then it runs away faster than you. Never seen again.
  if (!s.jm.gone) {
    s.jm.u += v * 1.6 + 0.3 * dt;
    const [x, y] = P(s.jm.u, s.jm.v);
    const w = JM_H * (jmImg.naturalWidth / jmImg.naturalHeight || 2.6);
    if (x - w / 2 > VW || y - JM_H > VH) {
      s.jm.gone = true;
      s.scenery.push({ type: 'sign', u: cam + aheadFor(R + 40, 120), v: R + 40, text: 'DIVERSION', sub: '⟲', color: '#d9a400', dark: true });
    }
  }

  p.ducking = !!(keys['ArrowDown'] || touchDuck);
  if (!p.onGround) {
    p.vz -= GRAVITY * dt * (p.ducking ? 2.6 : 1);
    p.z += p.vz * dt;
    if (p.z <= 0) { p.z = 0; p.vz = 0; p.onGround = true; }
  }

  s.nextObstacle -= v;
  if (s.nextObstacle <= 0) {
    spawnObstacle();
    s.nextObstacle = s.speed * 26 + 300 + Math.random() * 450;
  }
  for (const o of s.obstacles) if (o.type === 'drone') o.u -= 1.2 * dt;
  s.obstacles = s.obstacles.filter(o => o.u > cam - 900);

  fillScenery();
  s.nextEvent -= v;
  if (s.nextEvent <= 0) { spawnEvent(); s.nextEvent = 900 + Math.random() * 1300; }
  for (const o of s.scenery) {
    if (o.type === 'cow') o.v += o.walk * dt;
    if (o.type === 'auto') o.u += o.drive * dt;
  }
  s.scenery = s.scenery.filter(o => o.u > cam - 1600 && !(o.type === 'cow' && o.v > VFAR));

  // sky drone dropping Section 144 leaflets
  s.nextSkyDrone -= v;
  if (!s.skyDrone && s.nextSkyDrone <= 0) {
    s.skyDrone = { x: VW + 40, y: 50 + Math.random() * 90, drop: 40 };
    s.nextSkyDrone = 2500 + Math.random() * 2500;
  }
  if (s.skyDrone) {
    const d = s.skyDrone;
    d.x -= 2.2 * dt;
    if (--d.drop <= 0 && d.x < VW - 60) {
      s.leaflets.push({ x: d.x, y: d.y + 10, vx: -0.6 + Math.random() * 1.2, vy: 0.8, rot: Math.random() * 6, life: 220 });
      d.drop = 14 + Math.random() * 18;
    }
    if (d.x < -60) s.skyDrone = null;
  }
  for (const l of s.leaflets) {
    l.x += (l.vx + Math.sin((s.frame + l.rot * 30) / 12) * 0.8 - s.speed * 0.25) * dt;
    l.y += (l.vy - s.speed * 0.12) * dt + 0.9 * dt;
    l.rot += 0.05 * dt; l.life -= dt;
  }
  s.leaflets = s.leaflets.filter(l => l.life > 0);

  // advisories
  const m = metres();
  if (m > s.nextToastAt) {
    toast(TOASTS[Math.floor(Math.random() * TOASTS.length)]);
    s.nextToastAt = m + 280 + Math.random() * 260;
  }
  if (m > s.nextKm) {
    toast(`${Math.round(s.nextKm / 1000)} km marched. Jantar Mantar: still 2 km away.`, 220, '#1d6b3a');
    s.nextKm += 1000;
  }
  if (Math.floor(m / 100) > Math.floor((m - v * M_PER_U) / 100)) s.blinkUntil = s.frame + 50;
  if (m > hi) { hi = m; }

  const pb = playerBox();
  for (const o of s.obstacles) {
    if (overlap(pb, obstacleBox(o))) {
      s.mode = 'over';
      s.overFrame = s.frame;
      s.flash = 10;
      const list = o.type === 'drone' ? MESSAGES_DRONE.concat(MESSAGES_OVER) : MESSAGES_OVER;
      s.overMsg = list[Math.floor(Math.random() * list.length)];
      s.fir = 100 + Math.floor(Math.random() * 9800);
      localStorage.setItem('jm_hi', hi);
      break;
    }
  }
}

// =====================================================================
//  drawing
// =====================================================================
function poly(pts, fill, stroke) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
}
function quad(u0, u1, v0, v1, fill) { poly([P(u0, v0), P(u1, v0), P(u1, v1), P(u0, v1)], fill); }

function drawSky() {
  ctx.fillStyle = '#cfc6ae'; ctx.fillRect(0, 0, VW, VH);
}

function drawGround() {
  const a = cam - 4000, b = cam + 6000;
  // lawns
  quad(a, b, -6000, VFAR, '#b4b873');
  // mowing stripes perpendicular to the road give a sense of speed
  const stripe = 90;
  for (let u = Math.floor(a / stripe) * stripe; u < b; u += stripe * 2) {
    quad(u, u + stripe, R + 40, VFAR, 'rgba(255,255,255,0.07)');
    quad(u, u + stripe, -6000, -R - 140, 'rgba(255,255,255,0.07)');
  }
  // the city beyond the hedge: paved plaza, with a street between the rows of buildings
  quad(a, b, VFAR, 6000, '#cfc6ae');
  quad(a, b, VFAR + 165, VFAR + 215, '#8a8780');
  for (let u = Math.floor(a / 120) * 120; u < b; u += 120) quad(u, u + 50, VFAR + 189, VFAR + 191, '#e9e4d6');
  for (let u = Math.floor(a / 60) * 60; u < b; u += 60) {
    ctx.strokeStyle = 'rgba(120,110,90,0.18)'; ctx.lineWidth = 1;
    const p0 = P(u, VFAR), p1 = P(u, VFAR + 165); ctx.beginPath(); ctx.moveTo(...p0); ctx.lineTo(...p1); ctx.stroke();
  }
  // hedge at the far edge
  quad(a, b, VFAR - 22, VFAR, '#6f7f45');
  // service lane on the near side (autos only, apparently)
  quad(a, b, -R - 140, -R - 40, '#7c7a74');
  for (let u = Math.floor(a / 120) * 120; u < b; u += 120) quad(u, u + 50, -R - 92, -R - 88, '#d8d2c0');
  // red sandstone footpaths
  quad(a, b, R + 8, R + 48, '#c98f74');
  quad(a, b, -R - 40, -R - 8, '#c98f74');
  ctx.lineWidth = 1;
  for (let u = Math.floor(a / 40) * 40; u < b; u += 40) {
    ctx.strokeStyle = 'rgba(120,60,40,0.25)';
    ctx.beginPath(); let p0 = P(u, R + 8), p1 = P(u, R + 48); ctx.moveTo(...p0); ctx.lineTo(...p1); ctx.stroke();
    ctx.beginPath(); p0 = P(u, -R - 40); p1 = P(u, -R - 8); ctx.moveTo(...p0); ctx.lineTo(...p1); ctx.stroke();
  }
  // the road
  quad(a, b, -R, R, '#646464');
  // lane markings
  for (let u = Math.floor(a / 110) * 110; u < b; u += 110) {
    quad(u, u + 50, R / 3 - 2, R / 3 + 2, '#e9e4d6');
    quad(u, u + 50, -R / 3 - 2, -R / 3 + 2, '#e9e4d6');
  }
  // Delhi kerbs: black and yellow
  for (let u = Math.floor(a / 30) * 30, i = Math.floor(a / 30); u < b; u += 30, i++) {
    const col = i % 2 ? '#1c1c1c' : '#f2c200';
    quad(u, u + 30, R, R + 8, col);
    quad(u, u + 30, -R - 8, -R, col);
    // near kerb side face
    const p0 = P(u, -R - 8), p1 = P(u + 30, -R - 8);
    poly([p0, p1, [p1[0], p1[1] + 4], [p0[0], p0[1] + 4]], i % 2 ? '#000' : '#b89300');
  }
}

const BUILDING_SIGNS = [
  { text: 'BJP OFFICE', sub: 'Open 24x7. Protest site: closed.', plate: '#f08a24', fg: '#fff', wall: ['#f6a24a', '#e07f1f', '#ffc27a'], flag: true },
  { text: 'WASHING MACHINE PVT LTD', sub: 'Join party, get clean', plate: '#2f7fd0', fg: '#fff', wall: ['#eef2f5', '#d3dae0', '#ffffff'] },
  { text: 'ED OFFICE', sub: 'Opposition counter only', plate: '#3d4a5c', fg: '#ffd34d' },
  { text: 'GODI MEDIA TV', sub: 'BREAKING: Protesters paid Rs 500', plate: '#c0392b', fg: '#fff', dish: true },
  { text: 'PM CARES', sub: 'Not under RTI', plate: '#1d6b3a', fg: '#fff' },
  { text: 'ELECTORAL BONDS', sub: 'Anonymous deposits welcome', plate: '#6b3fa0', fg: '#fff' },
  { text: 'MINISTRY OF PERMISSIONS', sub: 'Closed till further notice', plate: '#535353', fg: '#fff' },
  { text: 'IT CELL', sub: 'Now hiring: 10,000 trolls', plate: '#f08a24', fg: '#fff' },
  { text: 'CENTRAL VISTA', sub: 'Under construction since 2020', plate: '#d9a400', fg: '#1c1c1c' },
  { text: 'PARLIAMENT ST POLICE STN', sub: 'Detained protesters: this way', plate: '#1f2a44', fg: '#fff' },
];

// text painted on the near face (v = const) of something, running along u
function faceText(u, v, z, text, size, color, maxW) {
  const [x, y] = P(u, v, z);
  ctx.save(); ctx.translate(x, y); ctx.transform(UX, UY, 0, 1, 0, 0);
  ctx.font = `${size}px ${FONT}`;
  const w = ctx.measureText(text).width;
  if (maxW && w > maxW) ctx.scale(maxW / w, 1);
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.fillText(text, 0, 0);
  ctx.restore();
}
function facePlate(u0, u1, v, z0, z1, fill) { poly([P(u0, v, z0), P(u1, v, z0), P(u1, v, z1), P(u0, v, z1)], fill); }

function drawBuilding(o) {
  const sg = o.sign;
  const t = sg && sg.wall || [['#d8cdb6', '#c4b89f', '#e6dcc6'], ['#d6b9a4', '#c19f89', '#e3cbb8'], ['#cfcfc8', '#b9b9b0', '#dededa']][o.tone];
  const u0 = o.u, u1 = o.u + o.lu, v0 = o.v, v1 = o.v + o.d;
  isoShadow(u0 + o.lu / 2, v0 + o.d / 2, o.lu / 2, o.d / 2, 18);
  isoBox(u0, u1, v0, v1, 0, o.h, t[2], t[0], t[1]);
  // windows on the front and the side
  const top = sg ? o.h - 46 : o.h - 10;
  for (let z = 14; z < top; z += 16) {
    for (let k = 10; k < o.lu - 14; k += 18) facePlate(u0 + k, u0 + k + 9, v0, z, z + 8, 'rgba(90,100,110,0.3)');
    for (let k = 10; k < o.d - 12; k += 16) poly([P(u1, v0 + k, z), P(u1, v0 + k + 8, z), P(u1, v0 + k + 8, z + 8), P(u1, v0 + k, z + 8)], 'rgba(70,80,90,0.3)');
  }
  // door
  facePlate(u0 + o.lu / 2 - 8, u0 + o.lu / 2 + 8, v0, 0, 14, 'rgba(60,50,40,0.55)');
  if (!sg) return;
  // signboard
  facePlate(u0 + 8, u1 - 8, v0 - 0.5, o.h - 40, o.h - 6, sg.plate);
  faceText(u0 + o.lu / 2, v0 - 0.5, sg.sub ? o.h - 19 : o.h - 27, sg.text, 8, sg.fg, o.lu - 24);
  if (sg.sub) faceText(u0 + o.lu / 2, v0 - 0.5, o.h - 33, sg.sub, 6, sg.fg, o.lu - 24);
  if (sg.flag) {
    const [x, y] = P(u0 + 20, v0 + o.d / 2, o.h);
    const wave = Math.sin(state.frame / 8) * 3;
    ctx.fillStyle = '#555'; ctx.fillRect(x - 1, y - 46, 2, 46);
    ctx.fillStyle = '#f08a24';
    ctx.beginPath(); ctx.moveTo(x + 1, y - 46); ctx.lineTo(x + 28, y - 39 + wave); ctx.lineTo(x + 1, y - 30); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#1d8a3a'; ctx.fillRect(x + 1, y - 33, 10, 3);
  }
  if (sg.dish) {
    const [x, y] = P(u1 - 25, v0 + o.d / 2, o.h);
    ctx.fillStyle = '#777'; ctx.fillRect(x - 1, y - 14, 3, 14);
    ctx.fillStyle = '#e6e6e6'; ctx.strokeStyle = '#888'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(x, y - 20, 14, 9, -0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (Math.floor(state.frame / 20) % 2) { ctx.fillStyle = '#e03a2f'; ctx.fillRect(x - 2, y - 22, 4, 4); }
  }
}

// iso box: visible faces are the near side (v = v0), the +u end and the top
function isoBox(u0, u1, v0, v1, z0, z1, top, front, side) {
  poly([P(u0, v0, z0), P(u1, v0, z0), P(u1, v0, z1), P(u0, v0, z1)], front);
  poly([P(u1, v0, z0), P(u1, v1, z0), P(u1, v1, z1), P(u1, v0, z1)], side);
  poly([P(u0, v0, z1), P(u1, v0, z1), P(u1, v1, z1), P(u0, v1, z1)], top);
}
function isoShadow(u, v, ru, rv, ox = 14) {
  poly([P(u - ru + ox, v - rv), P(u + ru + ox, v - rv), P(u + ru + ox, v + rv), P(u - ru + ox, v + rv)], 'rgba(60,60,30,0.2)');
}

const TREE_GREENS = [['#93a95a', '#6b8a42', '#4f6b34'], ['#a3b35e', '#768f45', '#5a7438']];
function drawTree(o) {
  const s = o.size, [top, front, side] = TREE_GREENS[o.hue > 0.5 ? 0 : 1];
  const c = 24 * s, c2 = 15 * s;
  isoShadow(o.u, o.v, c, c);
  isoBox(o.u - 4, o.u + 4, o.v - 4, o.v + 4, 0, 30 * s, '#7d5a3a', '#6b4a2f', '#553a24');
  isoBox(o.u - c, o.u + c, o.v - c, o.v + c, 24 * s, 62 * s, top, front, side);
  isoBox(o.u - c2 - 3, o.u + c2 - 3, o.v - c2 + 3, o.v + c2 + 3, 62 * s, 82 * s, top, front, side);
}

function drawPalm(o) {
  const s = o.size, h = 130 * s;
  isoShadow(o.u, o.v, 22 * s, 22 * s, 30 * s);
  isoBox(o.u - 3, o.u + 3, o.v - 3, o.v + 3, 0, h, '#aaa192', '#9b9283', '#7f776a');
  // fronds: flat iso leaves drooping out from the crown
  const sway = Math.sin(state.frame / 40 + o.u) * 3;
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * Math.PI * 2 + 0.3, du = Math.cos(a) * 38 * s, dv = Math.sin(a) * 38 * s;
    const nu = -Math.sin(a) * 6 * s, nv = Math.cos(a) * 6 * s;
    poly([P(o.u, o.v, h), P(o.u + du * 0.5 + nu, o.v + dv * 0.5 + nv, h + 6), P(o.u + du + sway, o.v + dv, h - 18 * s),
          P(o.u + du * 0.5 - nu, o.v + dv * 0.5 - nv, h + 6)], i % 2 ? '#5a7438' : '#6b8a42');
  }
  isoBox(o.u - 4, o.u + 4, o.v - 4, o.v + 4, h - 4, h + 4, '#7d6a3a', '#6b5a2f', '#554624');
}

function drawBush(o) {
  isoShadow(o.u, o.v, 14, 10, 8);
  isoBox(o.u - 14, o.u + 14, o.v - 9, o.v + 9, 0, 14, '#7b9448', '#5f7a3a', '#4a6230');
  ctx.fillStyle = '#e8743b';
  for (let i = 0; i < 5; i++) { const [x, y] = P(o.u - 10 + i * 5, o.v + (i % 2 ? 4 : -4), 14); ctx.fillRect(x - 1.5, y - 1.5, 3, 3); }
}

function drawLamp(o) {
  const [x, y] = P(o.u, o.v);
  ctx.fillStyle = '#3d3d3d'; ctx.fillRect(x - 2, y - 110, 4, 110);
  ctx.fillRect(x - 2, y - 110, 22, 3);
  ctx.fillStyle = '#f1e7b8'; ctx.fillRect(x + 14, y - 107, 9, 4);
  ctx.fillStyle = '#2b2b2b'; ctx.fillRect(x - 4, y - 6, 8, 6);
}

function drawSign(o) {
  const [x, y] = P(o.u, o.v);
  ctx.fillStyle = '#555'; ctx.fillRect(x - 32, y - 70, 3, 70); ctx.fillRect(x + 30, y - 70, 3, 70);
  ctx.fillStyle = o.color; ctx.fillRect(x - 46, y - 104, 92, 40);
  ctx.strokeStyle = o.dark ? '#1c1c1c' : '#fff'; ctx.lineWidth = 2; ctx.strokeRect(x - 43, y - 101, 86, 34);
  ctx.fillStyle = o.dark ? '#1c1c1c' : '#fff'; ctx.textAlign = 'center';
  ctx.font = `8px ${FONT}`; ctx.fillText(o.text, x, y - 86);
  ctx.font = `9px ${FONT}`; ctx.fillText(o.sub, x, y - 73);
  ctx.textAlign = 'left';
}

function drawCow(o) {
  const [x, y] = P(o.u, o.v);
  const step = Math.floor(state.frame / 8) % 2;
  ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.ellipse(x, y, 26, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f4f0e6';
  ctx.fillRect(x - 22, y - 36, 40, 20);                // body
  ctx.fillRect(x + 16, y - 42, 14, 12);                // head
  ctx.fillStyle = '#e9ddc8'; ctx.fillRect(x - 6, y - 46, 12, 10);   // hump
  ctx.fillStyle = '#3a3a3a';
  ctx.fillRect(x - 12, y - 32, 9, 7); ctx.fillRect(x + 4, y - 28, 6, 5);
  ctx.fillRect(x + 25, y - 39, 2, 2);                  // eye
  ctx.fillStyle = '#c9b48a'; ctx.fillRect(x + 17, y - 47, 2, 5); ctx.fillRect(x + 27, y - 47, 2, 5);  // horns
  ctx.fillStyle = '#d9cbb3';
  const l = step ? 2 : -2;
  ctx.fillRect(x - 19 + l, y - 16, 4, 16); ctx.fillRect(x - 10 - l, y - 16, 4, 16);
  ctx.fillRect(x + 6 + l, y - 16, 4, 16); ctx.fillRect(x + 13 - l, y - 16, 4, 16);
  ctx.fillRect(x - 25, y - 34, 3, 16);                 // tail
  // the tag
  ctx.font = `7px ${FONT}`;
  const t = '✓ HAS PERMISSION';
  const w = ctx.measureText(t).width + 10;
  ctx.fillStyle = '#1d6b3a'; ctx.fillRect(x - w / 2, y - 66, w, 13);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(t, x, y - 56); ctx.textAlign = 'left';
}

function drawAuto(o) {
  // drives toward the player (−u), so we see its rear and its near side
  const u = o.u, v = o.v, bob = Math.floor(state.frame / 4) % 2;
  isoShadow(u, v, 40, 22, 6);
  const wheel = (wu, wv) => {
    const [x, y] = P(wu, wv, 7);
    ctx.fillStyle = '#1c1c1c'; ctx.beginPath(); ctx.ellipse(x, y, 7, 7.5, -0.45, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#888'; ctx.fillRect(x - 1.5, y - 1.5, 3, 3);
  };
  wheel(u - 32, v - 2);                                                        // front wheel (centre)
  isoBox(u - 40, u + 36, v - 20, v + 20, 7 + bob, 34 + bob, '#3aa04c', '#2e8b3e', '#24702f');   // body
  isoBox(u - 40, u + 36, v - 20.5, v + 20.5, 18 + bob, 22 + bob, '#f2c200', '#f2c200', '#d9ad00');  // yellow stripe
  isoBox(u - 14, u + 32, v - 18, v + 18, 34 + bob, 62 + bob, '#2b2b2b', '#3b3b3b', '#262626');  // cabin
  isoBox(u - 18, u + 32, v - 18, v - 12, 38 + bob, 58 + bob, '#cfe3e8', '#cfe3e8', '#b8ccd2');  // side opening
  isoBox(u - 22, u + 36, v - 21, v + 21, 62 + bob, 69 + bob, '#ffd21f', '#f2c200', '#d9ad00');  // canopy
  // tail lights on the rear face
  const [lx, ly] = P(u + 36, v - 15, 26 + bob), [rx, ry] = P(u + 36, v + 15, 26 + bob);
  ctx.fillStyle = '#e03a2f'; ctx.fillRect(lx - 2.5, ly - 2.5, 5, 5); ctx.fillRect(rx - 2.5, ry - 2.5, 5, 5);
  wheel(u + 22, v - 21);                                                       // rear wheel (near side)
  const [bx, by] = P(u, v, 84);
  bubbleAt(bx, by, 'Jantar Mantar? Nahi jayenge.');
}

function drawChai(o) {
  const u = o.u, v = o.v;
  isoShadow(u, v, 34, 22, 10);
  const wheel = wu => {
    const [x, y] = P(wu, v - 16, 9);
    ctx.fillStyle = '#3b2a1c'; ctx.beginPath(); ctx.ellipse(x, y, 8, 9, -0.45, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#a0784e'; ctx.fillRect(x - 1.5, y - 1.5, 3, 3);
  };
  // canopy posts (back pair first)
  for (const [pu, pv] of [[u - 26, v + 16], [u + 26, v + 16]]) isoBox(pu - 1.5, pu + 1.5, pv - 1.5, pv + 1.5, 0, 62, '#666', '#555', '#444');
  isoBox(u - 30, u + 30, v - 16, v + 16, 10, 34, '#b07a4a', '#8a5a35', '#6b4325');          // cart
  isoBox(u - 31, u + 31, v - 17, v + 17, 34, 37, '#c8956a', '#9a6a42', '#7a5030');          // counter top
  isoBox(u - 18, u - 2, v - 6, v + 6, 37, 52, '#d6d6d6', '#b8b8b8', '#9a9a9a');             // kettle
  isoBox(u - 2, u + 5, v - 2, v + 2, 46, 49, '#b8b8b8', '#a0a0a0', '#888');                // spout
  for (let i = 0; i < 4; i++) isoBox(u + 8 + i * 5, u + 11 + i * 5, v - 10, v - 7, 37, 43, '#f4ead2', '#e6e0d0', '#cfc6b0');  // glasses
  wheel(u - 18); wheel(u + 18);
  for (const [pu, pv] of [[u - 26, v - 16], [u + 26, v - 16]]) isoBox(pu - 1.5, pu + 1.5, pv - 1.5, pv + 1.5, 0, 62, '#666', '#555', '#444');
  // striped tarp
  for (let i = 0; i < 6; i++) isoBox(u - 34 + i * 12, u - 22 + i * 12, v - 20, v + 20, 62, 66, i % 2 ? '#fff4e0' : '#c0392b', i % 2 ? '#eadcc2' : '#a83224', '#8e2a1e');
  // sign hanging off the tarp's front edge
  facePlate(u - 22, u + 22, v - 20.5, 50, 62, '#c0392b');
  faceText(u, v - 20.5, 53, 'CHAI Rs 10', 7, '#fff');
  // steam
  const [kx, ky] = P(u - 10, v, 52);
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2;
  for (let i = 0; i < 2; i++) {
    const t = (state.frame / 10 + i * 3) % 6;
    ctx.beginPath(); ctx.moveTo(kx - 3 + i * 6, ky - t * 3); ctx.quadraticCurveTo(kx + 3 + i * 6, ky - 6 - t * 3, kx - 3 + i * 6, ky - 12 - t * 3); ctx.stroke();
  }
  const [bx, by] = P(u, v, 80);
  bubbleAt(bx, by, 'Chai pi lo. Jantar Mantar kahin nahi jaa raha.');
}

function drawJantarMantar() {
  const jm = state.jm;
  if (jm.gone || !jmImg.complete || !jmImg.naturalWidth) return;
  const [x, y] = P(jm.u, jm.v);
  const h = JM_H, w = JM_H * jmImg.naturalWidth / jmImg.naturalHeight;
  ctx.fillStyle = 'rgba(60,60,30,0.22)';
  ctx.beginPath(); ctx.ellipse(x + 10, y - 2, w * 0.55, 20, 0, 0, Math.PI * 2); ctx.fill();
  ctx.drawImage(jmImg, x - w / 2, y - h, w, h);
  if (state.mode === 'ready') {
    // goal flag, Mario-style
    ctx.font = `9px ${FONT}`; ctx.textAlign = 'center';
    const bob = Math.sin(state.frame / 15) * 4;
    ctx.fillStyle = '#1d6b3a'; ctx.fillText('▼ GOAL ▼', x, y - h - 14 + bob);
    ctx.textAlign = 'left';
  }
}

function drawBarricade(u, v) {
  let [x, y] = P(u, v);
  if (state.frame < state.shoutUntil) { x += Math.sin(state.frame * 0.9 + u) * 2.5; y += Math.cos(state.frame * 1.1 + v) * 1.5; }
  if (barricadeImg.complete && barricadeImg.naturalWidth) ctx.drawImage(barricadeImg, x - BAR_FOOT_X, y - BAR_FOOT_Y, BAR_W, BAR_H);
}

function drawDrone(o, scale = 1, sx, sy) {
  let x, y;
  if (sx === undefined) {
    const bobZ = Math.sin(state.frame / 9 + o.u) * 2;
    const sh = P(o.u, 0, 0);
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(sh[0], sh[1], 26, 7, 0, 0, Math.PI * 2); ctx.fill();
    [x, y] = P(o.u, 0, o.z + 9 + bobZ);
  } else { x = sx; y = sy; }
  ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
  // arms
  ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-30, -9); ctx.lineTo(30, -9); ctx.stroke();
  // rotors
  const spin = Math.abs(Math.sin(state.frame * 0.9));
  ctx.fillStyle = 'rgba(40,40,40,0.35)';
  for (const rx of [-30, 30]) { ctx.beginPath(); ctx.ellipse(rx, -13, 16 * (0.4 + spin * 0.6), 2.5, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = '#2a2a2a'; for (const rx of [-30, 30]) ctx.fillRect(rx - 2, -14, 4, 6);
  // body
  ctx.fillStyle = '#1f2a44'; ctx.fillRect(-26, -9, 52, 15);
  ctx.fillStyle = '#ffffff'; ctx.font = `5px ${FONT}`; ctx.textAlign = 'center';
  ctx.fillText('DELHI POLICE', 0, 1);
  ctx.textAlign = 'left';
  // lights
  const blink = Math.floor(state.frame / 8) % 2;
  ctx.fillStyle = blink ? '#ff2b2b' : '#5a1010'; ctx.fillRect(-26, -12, 6, 3);
  ctx.fillStyle = blink ? '#1f3a7a' : '#3d7bff'; ctx.fillRect(20, -12, 6, 3);
  // camera + skids
  ctx.fillStyle = '#111'; ctx.fillRect(-4, 6, 8, 5);
  ctx.fillStyle = '#d33'; ctx.fillRect(-1, 8, 2, 2);
  ctx.fillStyle = '#2a2a2a'; ctx.fillRect(-18, 8, 2, 4); ctx.fillRect(16, 8, 2, 4); ctx.fillRect(-21, 11, 42, 2);
  ctx.restore();
}

function grid(rows, x0, y0, color) {
  ctx.fillStyle = color;
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    for (let c = 0; c < row.length; c++) if (row[c] === '#') ctx.fillRect(x0 + c * PX, y0 + r * PX, PX + 0.3, PX + 0.3);
  }
}
function cells(list, x0, y0, color) {
  ctx.fillStyle = color;
  for (const [c, r, w = 1, h = 1] of list) ctx.fillRect(x0 + c * PX, y0 + r * PX, w * PX + 0.3, h * PX + 0.3);
}

function drawPlacard(x, y, w, h) {
  ctx.fillStyle = '#fff6c8'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#535353'; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = '#b00000'; ctx.font = `6px ${FONT}`; ctx.textAlign = 'center';
  ctx.fillText('LET US', x + w / 2, y + h / 2 - 2);
  ctx.fillText('PROTEST', x + w / 2, y + h / 2 + 7);
  ctx.textAlign = 'left';
}

function drawDino() {
  const p = state.player;
  const [fx, fy] = P(cam, 0, p.z);
  const [gx, gy] = P(cam, 0, 0);
  const DINO = '#535353';
  // shadow
  const sh = Math.max(0.35, 1 - p.z / 200);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(gx + 4, gy, 30 * sh, 8 * sh, 0, 0, Math.PI * 2); ctx.fill();

  const running = state.mode === 'running' && p.onGround;
  const phase = running ? Math.floor(state.frame / 5) % 2 : -1;
  const dead = state.mode === 'over';

  if (p.ducking && p.onGround && !dead) {
    const x0 = fx - 9 * PX, y0 = fy - 10 * PX;
    grid(DUCK_TOP, x0, y0, DINO);
    grid(phase === 0 ? DUCK_A : DUCK_B, x0, y0 + 7 * PX, DINO);
    cells([[21, 1]], x0, y0, '#fff');                                    // eye
    cells([[18, -1, 9, 1]], x0 - 1, y0 - 1, DINO);                        // topi outline
    cells([[19, -2, 7, 1], [18, -1, 9, 1]], x0, y0, '#fbfbf6');           // Gandhi topi
    // placard carried low in front
    ctx.fillStyle = '#7a5230'; ctx.fillRect(x0 + 19 * PX, y0 + 4 * PX, 12 * PX, 2);
    drawPlacard(x0 + 29 * PX, y0 - 1 * PX, 12 * PX, 8 * PX);
  } else {
    const x0 = fx - 9 * PX, y0 = fy - 20 * PX;
    grid(DINO_TOP, x0, y0, DINO);
    grid(phase === -1 ? LEGS_STAND : phase === 0 ? LEGS_A : LEGS_B, x0, y0 + 16 * PX, DINO);
    cells([[12, 1]], x0, y0, '#fff');
    if (dead) cells([[12, 1, 0.5, 0.5]], x0 + PX * 0.25, y0 + PX * 0.25, DINO);
    // Gandhi topi
    ctx.fillStyle = DINO; ctx.fillRect(x0 + 10 * PX - 1, y0 - 2 * PX - 1, 9 * PX + 2, 2 * PX + 2);
    cells([[11, -2, 7, 1], [10, -1, 9, 1]], x0, y0, '#fbfbf6');
    // arm reaching forward to hold the stick
    cells([[17, 9, 4, 1]], x0, y0, DINO);
    // stick + placard
    const bob = phase === 1 ? PX : 0;
    ctx.fillStyle = '#7a5230'; ctx.fillRect(x0 + 21 * PX, y0 - 9 * PX + bob, 3, 20 * PX);
    drawPlacard(x0 + 14 * PX, y0 - 17 * PX + bob, 15 * PX, 9 * PX);
  }
  if (state.bubble && state.frame < state.bubble.until) bubbleAt(fx + 20, fy - 140, state.bubble.text);
}

let bubbles = [];
function bubbleAt(x, y, text) { bubbles.push([x, y, text]); }
function drawBubble(x, y, text) {
  ctx.font = `8px ${FONT}`;
  const w = ctx.measureText(text).width + 16, h = 22;
  const bx = x - w / 2;
  ctx.fillStyle = '#fffdf5'; ctx.strokeStyle = '#535353'; ctx.lineWidth = 2;
  ctx.fillRect(bx, y - h, w, h); ctx.strokeRect(bx, y - h, w, h);
  ctx.beginPath(); ctx.moveTo(x - 5, y); ctx.lineTo(x + 5, y); ctx.lineTo(x, y + 7); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fffdf5'; ctx.fillRect(x - 4, y - 2, 8, 3);
  ctx.fillStyle = '#333'; ctx.fillText(text, bx + 8, y - 8);
}

function drawWorld() {
  const s = state;
  const items = [];
  for (const o of s.scenery) {
    const key = o.u - 1.087 * o.v;
    const fn = { tree: drawTree, palm: drawPalm, bush: drawBush, lamp: drawLamp, sign: drawSign, cow: drawCow, auto: drawAuto, chai: drawChai, building: drawBuilding }[o.type];
    items.push({ key: o.type === 'building' ? o.u + o.lu / 2 - 1.087 * (o.v + o.d / 2) : key, draw: () => fn(o) });
  }
  if (!s.jm.gone) items.push({ key: s.jm.u - 1.087 * s.jm.v, draw: drawJantarMantar });
  for (const o of s.obstacles) {
    if (o.type === 'bar') {
      for (let i = 0; i < o.n; i++) for (let j = 2; j >= 0; j--) {
        const u = o.u + i * ROW_GAP;
        items.push({ key: u + (2 - j) * 0.001, draw: () => drawBarricade(u, -R + j * BAR_FACE) });
      }
    } else items.push({ key: o.u, draw: () => drawDrone(o) });
  }
  items.push({ key: cam + 0.5, draw: drawDino });
  items.sort((a, b) => a.key - b.key);
  drawGround();
  for (const it of items) it.draw();
}

function drawSkyLife() {
  const s = state;
  if (s.skyDrone) drawDrone(null, 0.55, s.skyDrone.x, s.skyDrone.y);
  for (const l of s.leaflets) {
    ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(Math.sin(l.rot) * 0.6);
    ctx.globalAlpha = Math.min(1, l.life / 40);
    ctx.fillStyle = '#fffdf4'; ctx.fillRect(-6, -4, 12, 8);
    ctx.strokeStyle = '#888'; ctx.lineWidth = 0.6; ctx.strokeRect(-6, -4, 12, 8);
    ctx.fillStyle = '#b00000'; ctx.fillRect(-4, -1, 8, 1); ctx.fillRect(-4, 1.5, 5, 1);
    ctx.restore();
  }
}

const km = m => (m / 1000).toFixed(2) + ' km';
function drawHUD() {
  const s = state;
  ctx.font = `14px ${FONT}`;
  ctx.fillStyle = '#535353';
  ctx.textAlign = 'right';
  const blink = s.frame < s.blinkUntil && Math.floor(s.frame / 8) % 2;
  if (!blink) ctx.fillText(km(metres()), VW - 24, 36);
  ctx.fillStyle = '#8a8a8a'; ctx.font = `10px ${FONT}`;
  ctx.fillText(`HI ${km(hi)}`, VW - 24, 58);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#8a7a50'; ctx.font = `9px ${FONT}`;
  ctx.fillText(`AQI ${430 + Math.floor((cam / 41) % 70)}`, 24, 36);

  const t = s.toast;
  if (t && s.frame < t.until) {
    ctx.font = `10px ${FONT}`;
    const text = '⚠ ' + t.text;
    const w = ctx.measureText(text).width + 28;
    ctx.fillStyle = t.color || 'rgba(176,0,0,0.92)';
    ctx.fillRect(VW / 2 - w / 2, 76, w, 30);
    ctx.fillStyle = t.color ? '#fff' : '#ffd34d';
    ctx.textAlign = 'center';
    ctx.fillText(text, VW / 2, 96);
    ctx.textAlign = 'left';
  }
}

function centerBox(lines, bg) {
  const h = lines.reduce((a, l) => a + l.gap, 0) + 30;
  const y0 = Math.max(120, VH * 0.2);
  let w = 0;
  for (const l of lines) { ctx.font = `${l.size}px ${FONT}`; w = Math.max(w, ctx.measureText(l.text).width); }
  w += 60;
  ctx.fillStyle = bg; ctx.fillRect(VW / 2 - w / 2, y0, w, h);
  ctx.strokeStyle = '#535353'; ctx.lineWidth = 3; ctx.strokeRect(VW / 2 - w / 2, y0, w, h);
  ctx.textAlign = 'center';
  let y = y0 + 12;
  for (const l of lines) { y += l.gap; ctx.font = `${l.size}px ${FONT}`; ctx.fillStyle = l.color; ctx.fillText(l.text, VW / 2, y); }
  ctx.textAlign = 'left';
}

function drawOverlay() {
  const s = state;
  if (s.mode === 'ready') {
    centerBox([
      { text: 'ROAD TO JANTAR MANTAR', size: 20, color: '#b00000', gap: 30 },
      { text: 'Your destination is right there →', size: 9, color: '#535353', gap: 28 },
      { text: 'SPACE / ↑ / TAP to start & jump', size: 9, color: '#535353', gap: 24 },
      { text: '↓ / tap bottom of screen to duck', size: 9, color: '#535353', gap: 20 },
    ], 'rgba(247,241,225,0.92)');
  } else if (s.mode === 'over') {
    centerBox([
      { text: 'PERMISSION DENIED', size: 22, color: '#ffd34d', gap: 34 },
      { text: s.overMsg, size: 9, color: '#fff', gap: 30 },
      { text: `You marched ${km(metres())}. Jantar Mantar is still 2 km away.`, size: 8, color: '#ffe9b0', gap: 24 },
      { text: `FIR No. ${s.fir}/${new Date().getFullYear()}`, size: 8, color: '#ffb0a0', gap: 22 },
      { text: 'SPACE / TAP to re-apply', size: 9, color: '#fff', gap: 30 },
    ], 'rgba(176,0,0,0.94)');
  }
}

function draw() {
  drawSky();
  bubbles = [];
  drawWorld();
  drawSkyLife();
  for (const b of bubbles) drawBubble(...b);
  drawHUD();
  drawOverlay();
  if (state.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${state.flash / 12})`; ctx.fillRect(0, 0, VW, VH); state.flash--; }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(2.5, (now - last) / (1000 / 60));
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
reset(false);
requestAnimationFrame(loop);
</script>
</body>
</html>
